<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="estilo.css">
<script src="datos.js"></script>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="kicker" id="kicker"></p>
    <h1 id="titulo"></h1>
    <p class="sub" id="sub"></p>
    <p class="meta" id="meta"></p>
  </div>
</header>

<main class="wrap">
  <section id="sec-logros">
    <h2>Logros</h2>
    <div class="stats" id="logros"></div>
  </section>

  <section id="sec-objetivos">
    <h2>Objetivos</h2>
    <div class="goals" id="objetivos"></div>
  </section>

  <section id="sec-avances">
    <h2>Avances</h2>
    <ol class="timeline" id="avances"></ol>
  </section>

  <section id="sec-proximos">
    <h2>Lo que sigue</h2>
    <ul class="next" id="proximos"></ul>
  </section>
</main>

<footer class="wrap foot" id="pie"></footer>

<script src="app.js"></script>
</body>
</html>
